[project]
name = "harness-engineering-getting-started"
version = "0.1.0"
description = "Agent = Model + Harness: a small agent harness built from scratch, with evals that show each fix."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Gopal Saini" }]
dependencies = [
    "anthropic>=1.11",
    "pytest>=8", # the agent's run_tests tool and the eval grader run pytest
]

[project.scripts]
harness = "harness.cli:main"

[dependency-groups]
dev = ["ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["evals/tasks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"] # the formatter wraps code; long strings stay readable

[tool.pytest.ini_options]
testpaths = ["tests"]
