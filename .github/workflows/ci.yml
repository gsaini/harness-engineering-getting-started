name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # setup-uv publishes exact version tags only
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Everything below is offline: no API key, no network calls to Claude, no cost.
      - run: uv run pytest -q
      - name: Scoreboard (scripted model)
        run: |
          uv run harness eval --out runs
          cat runs/*/scoreboard.md >> "$GITHUB_STEP_SUMMARY"
